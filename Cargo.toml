[package]
name = "bettergit"
version = "0.1.1-pilot.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Git-native granular encryption and restricted collaboration"
repository = "https://github.com/MegaPanchamZ/bettergit"
homepage = "https://github.com/MegaPanchamZ/bettergit"

[dependencies]
anyhow = "1"
age = { version = "0.11", default-features = false }
ed25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gix-packetline = { version = "0.24.2", features = ["blocking-io"] }
globset = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
zeroize = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
yaml-edit = "0.3.6"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
panic = "abort"
