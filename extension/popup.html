<!doctype html><html lang="en"><meta charset="utf-8"><title>Better Git</title><body style="width:520px;font:14px system-ui;padding:16px"><h1>Better Git</h1><p>Select encrypted diff text on a GitHub pull request, then open this viewer. Keys and plaintext stay in this popup until it closes.</p><p><label>Repository file path <input id="path" placeholder=".env.production"></label><label> Format <select id="format"><option value="env">dotenv</option><option value="json">JSON (complete file)</option><option value="yaml">YAML (complete file)</option></select></label></p><p><label>Access group <input id="group" placeholder="github-team:infra"></label></p><p><label>Verified group age recipient <input id="recipient" autocomplete="off"></label></p><label>Your age identity <input id="identity" type="password" autocomplete="off"></label><p><label>Wrapped group key (base64)<textarea id="envelope" rows="3"></textarea></label></p><button id="decrypt">Decrypt selection locally</button><button id="clear">Clear</button><p id="status" role="status"></p><pre id="result" style="white-space:pre-wrap"></pre><script type="module" src="popup.js"></script></body></html>
