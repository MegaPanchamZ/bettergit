<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repositories · Better Git</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard/dashboard.css?v=workspace-join">
  <script src="/dashboard/dashboard.js?v=workspace-join" defer></script>
</head>
<body>
  <header class="top">
    <a href="/">Better Git</a>
    <div class="account" id="account" hidden>
      <span id="username"></span>
      <button type="button" id="logout">Sign out</button>
    </div>
  </header>
  <main>
    <section id="login" class="login" hidden>
      <h1>Repository dashboard</h1>
      <p>See which teams your policy assigns to protected files and manage repository enrollment.</p>
      <button id="sign-in" type="button" class="primary">Sign in with GitHub</button>
      <div id="device" hidden>
        <p>Enter this code on GitHub.</p>
        <code id="device-code"></code>
        <a href="https://github.com/login/device" target="_blank" rel="noopener">Open GitHub device sign-in ↗</a>
      </div>
    </section>
    <div id="dashboard-notices" class="dashboard-notices">
      <p id="status"><span id="enrollment-alert" role="alert"></span><span id="status-message" role="status">Loading repositories…</span><span id="enrollment-notices"></span></p>
      <div class="notice-actions">
        <button id="dismiss-enrollment-notices" type="button" hidden>Dismiss confirmations</button>
        <button id="retry" type="button" hidden>Retry</button>
        <div id="additional-retries" hidden></div>
      </div>
    </div>
    <div id="enrollment-announcements" class="visually-hidden" role="log" aria-live="polite" aria-atomic="false" aria-relevant="additions"></div>
    <section id="inventory" hidden>
      <div class="heading">
        <h1>Repositories</h1>
        <div class="actions inventory-links">
          <a href="https://github.com/apps/better-git-app/installations/new">Install hosted App ↗</a>
          <a href="https://github.com/MegaPanchamZ/bettergit#hosted-better-git">Setup guide ↗</a>
        </div>
      </div>
      <div class="workspace">
        <section class="sidebar" aria-label="Find a repository">
          <div class="filters">
            <label class="visually-hidden" for="search">Search repositories</label>
            <input id="search" type="search" placeholder="Search owner or repository" autocomplete="off">
            <div class="filter-row">
              <label class="visually-hidden" for="owner-filter">Repository owner</label>
              <select id="owner-filter"><option value="">All owners</option></select>
              <label class="visually-hidden" for="state-filter">Enrollment status</label>
              <select id="state-filter">
                <option value="">All statuses</option>
                <option value="enrolled">Enrolled</option>
                <option value="attention">Needs attention</option>
                <option value="installed">Installed only</option>
              </select>
            </div>
          </div>
          <div class="results" id="results" tabindex="-1">
            <ul id="repos" aria-label="Repositories"></ul>
            <p id="empty-results" class="muted" hidden></p>
          </div>
          <footer class="results-footer">
            <span id="result-count" role="status"></span>
          </footer>
        </section>
        <section id="detail" class="detail" aria-label="Repository details" tabindex="-1"></section>
        <section id="filtered-detail" class="detail" aria-label="Filtered repository details" hidden>
          <p id="filter-message" class="muted" role="status"></p>
          <button id="clear-filters" type="button">Clear filters</button>
        </section>
      </div>
    </section>
    <noscript>The dashboard requires JavaScript.</noscript>
  </main>
</body>
</html>
